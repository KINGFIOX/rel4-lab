[workspace]
resolver = "2"
members = [
    "kernel",
    "userspace/sel4-user",
    "userspace/hello-rootserver",
    "userspace/uart-server",
    "userspace/vfs-server",
    "userspace/linux-abi",
    "userspace/linux-compat",
]
default-members = [
    "kernel",
    "userspace/sel4-user",
    "userspace/hello-rootserver",
    "userspace/uart-server",
    "userspace/vfs-server",
    "userspace/linux-abi",
    "userspace/linux-compat",
]

[profile.release]
opt-level = 3
debug = true
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false

[profile.dev]
opt-level = 1
debug = true
panic = "abort"
overflow-checks = true
